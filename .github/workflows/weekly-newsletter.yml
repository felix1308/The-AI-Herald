name: Weekly Newsletter

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch: {} # allows manual "Run workflow" trigger from the Actions tab

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Generate this week's issue
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: node scripts/generate-static.js

      - name: Commit generated issue to GitHub
        run: |
          git config user.name "ai-herald-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/latest.json
          git diff --quiet --cached || git commit -m "Weekly issue: $(date -u +'%Y-%m-%d')"
          git push origin HEAD:${{ github.ref_name }}

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git remote add space https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}
          git push --force space HEAD:main
